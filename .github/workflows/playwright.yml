name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      story:
        description: 'Story folder to run (e.g. PROJ-43-login-nafath). Leave empty to run all.'
        required: false
        default: ''
      grep:
        description: 'Tag filter (e.g. @smoke). Leave empty to run all.'
        required: false
        default: ''

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        env:
          ENV: staging
        run: |
          STORY="${{ github.event.inputs.story }}"
          GREP="${{ github.event.inputs.grep }}"

          CMD="npx playwright test --project=${{ matrix.project }}"
          [ -n "$STORY" ] && CMD="$CMD stories/$STORY"
          [ -n "$GREP" ]  && CMD="$CMD --grep $GREP"

          echo "Running: $CMD"
          $CMD

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
